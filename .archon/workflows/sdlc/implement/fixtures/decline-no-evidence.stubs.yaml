# Dry-run fixture: the guard seen RED on a cause with no evidence behind it (run with
# --exec-code). `inherited` is a label, not a claim — a pass on red the change did not
# cause is worth exactly the failing check the summary names, and an empty summary
# names none. Same bar the green gates hold, one node earlier: assert-changed
# executes for real and the run fails.
implement:
  done: true
  green: false
  red_cause: inherited
  summary: ""
# The repository this branch's pull requests belong to. Stubbed because the
# node is deterministic and resolves from git's push configuration, which a
# fixture checkout does not have.
pr-target:
  repo: "example/repo"
  reason: ""
fixture:
  expect: failed
  fail-node: assert-changed
exec-code: true
