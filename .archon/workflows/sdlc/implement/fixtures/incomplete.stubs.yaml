# Dry-run fixture: implement's own checks did not finish (run with --exec-code, so
# assert-changed decides for real). A provider limit stopped the turn's validation
# partway; every check that ran passed, the rest never ran. The loop declares
# `incomplete`, and assert-changed refuses it as an unfinished validation, not as
# red nobody explained, whatever else the turn did.
implement:
  done: true
  green: false
  red_cause: incomplete
  summary: "stub: a provider limit stopped validation during tests. type-check and lint passed; tests never finished."
# The repository this branch's pull requests belong to. Stubbed because the
# node is deterministic and resolves from git's push configuration, which a
# fixture checkout does not have.
pr-target:
  repo: "example/repo"
  reason: ""
fixture:
  expect: failed
  fail-node: assert-changed
exec-code: true
