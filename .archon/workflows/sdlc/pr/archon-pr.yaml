name: archon-pr
description: |
  Open a pull request for the committed work on the current branch — draft by
  default when composed, template-aware, with the body built from the run's
  artifacts. Verifies by reading the created PR back. Never sweeps unrelated
  changes and never force-pushes.

  Use when: committed work on a branch needs a PR — "open a PR", "create a
  draft PR for this branch".
  NOT for: implementing (implement), reviewing (review), or merging (always human).

model: medium
requires: [github]

inputs:
  draft:
    default: "true"
    description: '"true" opens the PR as a draft; anything else opens it ready for review.'

returns: pr

nodes:
  # The publish target, decided before anything public happens and decided
  # deterministically. It was resolved from the name `origin` in the command's
  # prose, which is the upstream in a fork checkout — the runs that published
  # correctly did so because the agent noticed its instruction did not fit the
  # checkout, and a contract that depends on that is not a contract. This reads
  # git's own push resolution for the branch instead, and refuses rather than
  # falling back when the checkout does not settle it. See the script.
  - id: target
    script: resolve-publish-target
    runtime: bun
    output_format:
      type: object
      properties:
        host: { type: string, minLength: 1 }
        path: { type: string, minLength: 1 }
        remote: { type: string, minLength: 1 }
        branch: { type: string, minLength: 1 }
      required: [host, path, remote, branch]

  - id: pr
    command: pr
    depends_on: [target]
    # The command receives the decided target rather than deriving one. Its
    # step 5 read-back still proves the pull request really landed there, so a
    # wrong value fails loudly at the producer instead of being recorded.
    with:
      repo_host: "$target.output.host"
      repo_path: "$target.output.path"
      push_remote: "$target.output.remote"
      head_branch: "$target.output.branch"
    output_type: pull-request
    # This is the durable ownership record for every later public action in
    # delivery and inbound forge event. Consumers use this qualified identity,
    # never gh's ambient branch lookup.
    output_format:
      type: object
      properties:
        repo:
          type: object
          properties:
            host: { type: string }
            path: { type: string }
          required: [host, path]
        number: { type: integer }
        url: { type: string }
        head: { type: string }
        base: { type: string }
        is_draft: { type: boolean }
      required: [repo, number, url, head, base, is_draft]
